name: Copilot Analytics

# Runs independently of the build and publish workflows so it can never block,
# cancel or interfere with them.
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - closed
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to collect analytics for'
        required: true
        type: string

jobs:
  collect-and-publish:
    name: Collect and publish Copilot analytics
    permissions:
      contents: read
      pull-requests: read
    uses: DEFRA/mmo-cr-devops-common/.github/workflows/copilot-analytics.yml@main
    with:
      pr-number: ${{ inputs.pr_number || '' }}
      ingest-url: ${{ vars.COPILOT_ANALYTICS_INGEST_URL }}
    secrets:
      ingest-token: ${{ secrets.COPILOT_INGEST_TOKEN }}
